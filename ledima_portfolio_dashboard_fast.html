/* ---------- LIQUID GLASS ---------- */

.glass{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02) 55%,rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.16);
  border-radius:26px;
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.08),inset 0 0 24px rgba(255,255,255,.04),0 18px 42px rgba(0,0,0,.30);
  transition:transform .45s cubic-bezier(.22,1,.36,1),box-shadow .45s ease,border-color .45s ease
}

.glass::before{
  content:"";
  position:absolute;
  inset:0 auto auto 0;
  width:72%;
  height:58%;
  left:14%;
  top:-28%;
  background:radial-gradient(ellipse at center,rgba(255,255,255,.34),rgba(255,255,255,.08) 48%,transparent 72%);
  filter:blur(8px);
  opacity:.75;
  pointer-events:none;
  transition:transform .6s ease,opacity .6s ease;
  z-index:0
}

.glass::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  border:1px solid rgba(255,255,255,.08);
  pointer-events:none;
  z-index:0
}

.glass > *{
  position:relative;
  z-index:1
}

.glass:hover{
  transform:translateY(-6px) scale(1.01);
  border-color:rgba(34,211,238,.65);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.1),0 0 0 1px rgba(34,211,238,.28),0 28px 58px rgba(0,0,0,.38),0 0 42px rgba(34,211,238,.18)
}

.glass:hover::before{
  transform:translate(14%,10%) scale(1.12);
  opacity:1
}

.glow-cyan{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 0 0 1px rgba(34,211,238,.18),0 18px 42px rgba(0,0,0,.30)
}

/* Animated flowing gradient border for the flagship card */

.flow-border{
  border:2px solid transparent;
  background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02) 55%,rgba(255,255,255,.05)) padding-box,linear-gradient(120deg,rgba(34,211,238,.75),rgba(167,139,250,.75),rgba(245,158,11,.75),rgba(34,211,238,.75)) border-box;
  background-size:auto,300% 300%;
  animation:borderFlow 7s linear infinite
}

@keyframes borderFlow{
  0%{
    background-position:0% 50%
  }

  50%{
    background-position:100% 50%
  }

  100%{
    background-position:0% 50%
  }
}

/* Frosted liquid navbar */

.liquid-nav{
  border-radius:28px;
  backdrop-filter:blur(30px) saturate(190%);
  -webkit-backdrop-filter:blur(30px) saturate(190%);
  background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  overflow:hidden
}

.liquid-nav::after{
  content:"";
  position:absolute;
  top:0;
  left:-45%;
  width:38%;
  height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);
  transform:skewX(-18deg);
  animation:shineSweep 4.2s ease-in-out infinite;
  pointer-events:none
}

@keyframes shineSweep{
  0%,55%{
    left:-45%
  }

  80%,100%{
    left:130%
  }
}

/* Liquid buttons */

.liquid-btn{

  overflow:hidden;
  isolation:isolate;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease,background .3s ease,border-color .3s ease
}

.liquid-btn::after{
  content:"";
  position:absolute;
  top:0;
  left:-60%;
  width:45%;
  height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);
  transform:skewX(-18deg);
  transition:left .55s ease;
  pointer-events:none
}

.liquid-btn:hover::after{
  left:135%
}

.liquid-btn:active{
  transform:scale(.95) translateY(1px)
}

/* ---------- LIQUID BLOBS ---------- */

.blob-layer{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0
}

.blob{
  position:absolute;
  border-radius:58% 42% 55% 45%/52% 58% 42% 48%;
  filter:blur(80px);
  opacity:.5;
  will-change:transform,border-radius
}

.blob-cyan{
  width:min(520px,78vw);
  height:min(520px,78vw);
  left:-110px;
  top:6%;
  background:#0891B2;
  animation:blobMorph 12s ease-in-out infinite,blobDrift1 18s ease-in-out infinite alternate
}

.blob-purple{
  width:min(460px,72vw);
  height:min(460px,72vw);
  right:-100px;
  top:34%;
  background:#7C3AED;
  opacity:.42;
  animation:blobMorph 12s ease-in-out infinite reverse,blobDrift2 20s ease-in-out infinite alternate
}

.blob-gold{
  width:min(430px,68vw);
  height:min(430px,68vw);
  left:38%;
  bottom:-160px;
  background:#D97706;
  opacity:.34;
  animation:blobMorph 12s ease-in-out infinite 2s,blobDrift1 22s ease-in-out infinite alternate-reverse
}

@keyframes blobMorph{
  0%,100%{
    border-radius:58% 42% 55% 45%/52% 58% 42% 48%
  }

  33%{
    border-radius:44% 56% 42% 58%/58% 44% 56% 42%
  }

  66%{
    border-radius:56% 44% 62% 38%/44% 58% 42% 56%
  }
}

@keyframes blobDrift1{
  from{
    transform:translate(0,0) rotate(0deg)
  }

  to{
    transform:translate(46px,34px) rotate(14deg)
  }
}

@keyframes blobDrift2{
  from{
    transform:translate(0,0) rotate(0deg)
  }

  to{
    transform:translate(-42px,28px) rotate(-12deg)
  }
}

/* Cursor glow */

.cursor-glow{
  position:fixed;
  width:360px;
  height:360px;
  border-radius:50%;

  z-index:1;

/* ================= PERFORMANCE PASS =================
   Goal: same look, no per-frame blur work.
   - no backdrop-filter (26 live blurs over moving blobs was the main lag)
   - blobs are plain radial gradients, drift via transform only
   - no animated border-radius / box-shadow / left / background-position
   - no mix-blend-mode, no transition:all
*/
.glass,.liquid-nav{
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important
}
.glass{
  background-color:rgba(10,17,40,.52);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 10px 24px rgba(0,0,0,.26);
  transition:transform .35s cubic-bezier(.22,1,.36,1),border-color .35s ease
}
.glass::before{filter:none}
.glow-cyan{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 1px rgba(34,211,238,.18),0 10px 24px rgba(0,0,0,.26)
}
.glass:hover{
  transform:translateY(-4px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 0 0 1px rgba(34,211,238,.28),0 14px 30px rgba(0,0,0,.34)
}
.liquid-nav{background-color:rgba(10,17,40,.84)}

/* Blobs: gradient instead of filter:blur, transform-only drift */
.blob{
  filter:none;
  border-radius:50%;
  contain:layout paint;
  will-change:transform
}
.blob-cyan{
  background:radial-gradient(closest-side,rgba(8,145,178,.95),rgba(8,145,178,.45) 45%,rgba(8,145,178,0) 100%);
  animation:blobShift1 22s ease-in-out infinite alternate
}
.blob-purple{
  background:radial-gradient(closest-side,rgba(124,58,237,.95),rgba(124,58,237,.45) 45%,rgba(124,58,237,0) 100%);
  animation:blobShift2 26s ease-in-out infinite alternate
}
.blob-gold{
  background:radial-gradient(closest-side,rgba(217,119,6,.95),rgba(217,119,6,.45) 45%,rgba(217,119,6,0) 100%);
  animation:blobShift1 30s ease-in-out infinite alternate-reverse
}
@keyframes blobShift1{from{transform:translate3d(0,0,0)}to{transform:translate3d(46px,34px,0)}}
@keyframes blobShift2{from{transform:translate3d(0,0,0)}to{transform:translate3d(-42px,28px,0)}}

/* Nav shine: move with transform instead of animating `left` (layout) */
.liquid-nav::after{
  animation:shineSweepFast 4.2s ease-in-out infinite;
  will-change:transform
}
@keyframes shineSweepFast{
  0%,55%{transform:translateX(0) skewX(-18deg)}
  80%,100%{transform:translateX(460%) skewX(-18deg)}
}

/* Flowing border only moves while hovered (it repainted a big card every frame) */
.flow-border{animation-play-state:paused}
.flow-border:hover{animation-play-state:running}

/* Cursor glow: normal blending is much cheaper than screen */
.cursor-glow{mix-blend-mode:normal}

/* No more "transition: all" on every link/button */
a,button{
  transition:color .2s ease,background-color .2s ease,border-color .2s ease,opacity .2s ease,transform .2s ease,box-shadow .2s ease
}

@media (max-width:768px),(hover:none){
  .glass:hover{transform:none}
  .blob-gold{display:none}
}

<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mzansi Eats</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0c;--gold:#c98b4b;--cream:#f2e7d9;--ink:#1a120a;--muted:#8d7a68;--ph:#d8c9b8;box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:#050505;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#050505;color:#fff}
.app{max-width:378.4px;margin:0 auto;background:var(--bg);min-height:100vh;padding:17.2px 18.9px 94.6px;position:relative}
header{display:flex;align-items:center;gap:8.6px}
.brand{display:flex;align-items:center;gap:6.9px;flex:1}
.brand b{color:var(--gold);font-size:21.5px;line-height:.95;font-weight:700}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.ic{width:25.8px;height:25.8px;stroke:var(--gold);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.loc{display:flex;align-items:center;gap:8.6px;margin:24.1px 0 12px;color:var(--cream);font-size:12.9px;font-weight:500}
.loc svg{width:18.9px;height:18.9px;fill:var(--gold)}
h1{margin:0;color:var(--gold);font-size:26.7px;font-weight:700;letter-spacing:-.2px;line-height:1.15}
.sub{margin:6.9px 0 20.6px;color:var(--gold);font-size:14.6px;font-weight:500}
.search{display:flex;align-items:center;gap:10.3px;border:1.5px solid #6b4a2b;border-radius:10.3px;padding:0 13.8px;height:46.4px}
.search svg{width:20.6px;height:20.6px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--cream);font:inherit;font-size:12.9px}
.search input::placeholder{color:#9b8a79}
.search:focus-within{border-color:var(--gold)}
h2{font-size:18.9px;font-weight:700;margin:0}
.browse{margin:25.8px 0 12px}
.chips{display:flex;gap:10.3px;overflow-x:auto;margin:0 -18.9px;padding:0 18.9px 3.4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--cream);color:var(--ink);padding:10.3px 15.5px;border-radius:10.3px;font-size:12.9px;font-weight:500;transition:background .2s,color .2s}
.chip.on{background:var(--gold)}
.chip:focus-visible,.nav button:focus-visible,.top:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;margin:29.2px 0 12px}
.row a{color:var(--gold);font-weight:600;font-size:14.6px;text-decoration:none}
.card{display:flex;gap:15.5px;background:var(--cream);color:var(--ink);border-radius:15.5px;padding:14.6px;margin-bottom:13.8px;align-items:center}
.card img{width:96.3px;height:89.4px;border-radius:10.3px;object-fit:cover;flex:none}
.card h3{margin:0 0 5.2px;font-size:15.5px;font-weight:700;line-height:1.2}
.card p{margin:0 0 10.3px;font-size:12px;line-height:1.35}
.meta{font-size:12.9px;display:flex;align-items:center;gap:5.2px}
.meta svg{width:15.5px;height:15.5px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linejoin:round}
.card[hidden]{display:none}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:378.4px;background:var(--bg);display:flex;justify-content:space-around;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid #1d1710}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3.4px;color:var(--muted);font-size:12.9px;font-weight:500;transition:color .2s}
.nav button svg{width:29.2px;height:29.2px;fill:currentColor}
.nav button.on{color:var(--gold)}
.empty{color:var(--muted);text-align:center;padding:17.2px 0}
@keyframes in{from{opacity:0;transform:translateY(8.6px)}to{opacity:1;transform:none}}
.card{animation:in .5s both}.card:nth-of-type(2){animation-delay:.1s}.card:nth-of-type(3){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){.card{animation:none}*{transition:none!important}}
.top{position:relative}
#badge{position:absolute;top:-2px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:#fff;color:#000;font:700 10px/17px Inter,sans-serif;text-align:center;padding:0 4px}
.loc{cursor:pointer}
.card{position:relative}
.add{position:absolute;right:12px;bottom:12px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--cream);font-size:20px;line-height:1;transition:transform .15s}
.add:active{transform:scale(.88)}
.add:focus-visible,.q button:focus-visible,.pri:focus-visible,.sec:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:378px;max-height:80vh;overflow:auto;transform:translate(-50%,100%);transition:transform .25s;background:#171310;border-radius:18px 18px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));z-index:21}
.ov.open .sheet{transform:translate(-50%,0)}
.line{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #2a221b;color:var(--cream);font-size:14px}
.line span:first-child{flex:1}
.q{display:flex;align-items:center;gap:8px}
.q button{width:26px;height:26px;border-radius:50%;background:#2a221b;color:var(--gold);font-size:16px}
.tot{display:flex;justify-content:space-between;margin:16px 0;font-weight:700;font-size:17px;color:var(--cream)}
.pri,.sec{width:100%;padding:13px;border-radius:12px;font-weight:600;font-size:15px}
.pri{background:var(--gold);color:var(--ink)}.sec{background:#2a221b;color:var(--cream);margin-top:10px}
.view{padding-top:20px}
.order{background:var(--cream);color:var(--ink);border-radius:14px;padding:14px;margin-top:12px;font-size:14px}
.order b{display:flex;justify-content:space-between;margin-bottom:4px}
select{width:100%;margin:8px 0 16px;padding:12px;border-radius:10px;background:#171310;color:var(--cream);border:1.5px solid #6b4a2b;font:inherit}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--gold);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:30;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.app{background:radial-gradient(circle at 88% 36%,rgba(201,139,75,.32),transparent 42%),radial-gradient(circle at 8% 62%,rgba(160,70,30,.34),transparent 45%),radial-gradient(circle at 80% 90%,rgba(201,139,75,.22),transparent 40%),var(--bg)}
.card,.order{background:rgba(242,231,217,.1);color:var(--cream);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.card h3{color:#fff}
.card p{color:rgba(242,231,217,.82)}
.meta svg{stroke:var(--gold)}
.add{background:var(--gold);color:var(--ink)}
</style></head><body>
